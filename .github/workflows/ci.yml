name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # test-changelog.sh 需要完整的 tag 历史（默认 depth=1 会拿不到 v0.1.7 等旧 tag）
          fetch-depth: 0

      - name: Show Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project AgentRing.xcodeproj \
            -scheme AgentRing \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"

      - name: Build Debug
        run: |
          set -euo pipefail
          xcodebuild \
            -project AgentRing.xcodeproj \
            -scheme AgentRing \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -destination "generic/platform=macOS" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            build

      - name: Validate updater release tooling
        run: bash Scripts/test-release-tools.sh

      - name: Validate changelog generator
        run: bash Scripts/test-changelog.sh

      - name: Validate encrypted credential store
        run: bash Scripts/test-credential-store.sh

      - name: Validate Cursor login navigation
        run: bash Scripts/test-cursor-login-navigation.sh

      - name: Validate ring display logic
        run: bash Scripts/test-ring-display.sh

      - name: Validate Sparkle delegate integration
        run: bash Scripts/test-update-manager.sh "$RUNNER_TEMP/SourcePackages/artifacts/sparkle/Sparkle"
